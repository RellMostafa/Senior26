<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rell - Senior26</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/profiles.css">
    <style>
        /* Dark Red Crimson Blood Theme for Rell */
        body {
            background-color: #0a0000;
            background-image: 
                radial-gradient(ellipse 1400px 800px at 20% 30%, rgba(139, 0, 0, 0.25), transparent 50%),
                radial-gradient(ellipse 1200px 700px at 80% 70%, rgba(180, 0, 0, 0.20), transparent 50%),
                radial-gradient(ellipse 1000px 600px at 50% 50%, rgba(100, 0, 0, 0.15), transparent 60%);
        }

        /* Crimson aurora wave layers */
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background: 
                radial-gradient(ellipse 1600px 900px at 15% 20%, rgba(139, 0, 0, 0.18), transparent 55%),
                radial-gradient(ellipse 1400px 800px at 85% 80%, rgba(180, 0, 0, 0.15), transparent 55%),
                radial-gradient(ellipse 1200px 700px at 50% 50%, rgba(100, 0, 0, 0.12), transparent 60%);
            filter: blur(60px);
            opacity: 0.9;
            animation: crimsonFlow 20s ease-in-out infinite alternate;
        }

        body::after {
            background: 
                radial-gradient(ellipse 1800px 1000px at 30% 60%, rgba(139, 0, 0, 0.12), transparent 60%),
                radial-gradient(ellipse 1600px 900px at 70% 40%, rgba(180, 0, 0, 0.10), transparent 60%);
            filter: blur(80px);
            opacity: 0.7;
            animation: crimsonFlow 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes crimsonFlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.7;
            }
            33% {
                transform: translate(-30px, 20px) scale(1.05);
                opacity: 0.9;
            }
            66% {
                transform: translate(20px, -30px) scale(0.98);
                opacity: 0.8;
            }
            100% {
                transform: translate(0, 0) scale(1.02);
                opacity: 0.7;
            }
        }

        /* Update particles to have red glow */
        .particle {
            box-shadow:
                0 0 12px rgba(139, 0, 0, 0.6),
                0 0 20px rgba(180, 0, 0, 0.4);
        }

        /* Crimson-tinted glass elements */
        .section {
            background: linear-gradient(135deg, rgba(20, 0, 0, 0.7), rgba(15, 0, 0, 0.45));
            border: 1px solid rgba(139, 0, 0, 0.25);
            box-shadow:
                0 18px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(139, 0, 0, 0.15) inset,
                0 0 40px rgba(139, 0, 0, 0.12);
        }

        .profile-circle {
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid rgba(139, 0, 0, 0.3);
            box-shadow:
                0 22px 80px rgba(0,0,0,0.7),
                0 0 50px rgba(139, 0, 0, 0.25),
                0 0 70px rgba(180, 0, 0, 0.15);
        }

        .profile-circle::before {
            background: conic-gradient(
                from 180deg,
                rgba(139, 0, 0, 0.0),
                rgba(139, 0, 0, 0.5),
                rgba(180, 0, 0, 0.45),
                rgba(100, 0, 0, 0.4),
                rgba(139, 0, 0, 0.0)
            );
            filter: blur(12px);
            opacity: 0.7;
        }

        .profile-name {
            text-shadow:
                0 18px 65px rgba(0,0,0,0.7),
                0 0 35px rgba(139, 0, 0, 0.5),
                0 0 50px rgba(180, 0, 0, 0.3);
        }

        .back-button {
            background: linear-gradient(135deg, rgba(20, 0, 0, 0.7), rgba(15, 0, 0, 0.5));
            border: 1px solid rgba(139, 0, 0, 0.3);
            box-shadow: 
                0 10px 35px rgba(0,0,0,0.5),
                0 0 20px rgba(139, 0, 0, 0.15);
        }

        .back-button:hover {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.2), rgba(20, 0, 0, 0.7));
            box-shadow: 
                0 15px 50px rgba(0,0,0,0.6),
                0 0 35px rgba(139, 0, 0, 0.4),
                0 0 50px rgba(180, 0, 0, 0.3);
            border-color: rgba(139, 0, 0, 0.5);
        }

        .header-inner {
            background: linear-gradient(135deg, rgba(20, 0, 0, 0.65), rgba(15, 0, 0, 0.40));
            border: 1px solid rgba(139, 0, 0, 0.2);
            box-shadow:
                0 12px 50px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(139, 0, 0, 0.15),
                0 0 40px rgba(139, 0, 0, 0.08);
        }

        .nav-link:hover {
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
        }

        .nav-link::after {
            background: linear-gradient(90deg, #8b0000, #b40000);
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.8), 0 0 25px rgba(180, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="particles-container"></div>
    
    <header class="site-header">
        <div class="header-inner">
            <div class="brand"><a href="../index.html" class="nav-link">Senior26</a></div>
            <nav class="main-nav nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../memories.html" class="nav-link">Memories Hall</a>
                <a href="../games.html" class="nav-link">Games</a>
                <a href="#" class="nav-link">About</a>

    <a href="../memories.html" class="back-button">← Back to Memories Hall</a>

    <main class="profile-page">
        <div class="profile-content">
            <h1 class="profile-name">Rell</h1>
            
            <div class="section">

                <div class="section-content">

                </div>
            </div>

            <div class="section">

    <script src="../js/particles.js"></script>
    <script src="../js/animations.js"></script>
</body>
</html>
