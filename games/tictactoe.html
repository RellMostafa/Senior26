<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Senior26</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/game-common.css">
    <style>
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 140px);
            grid-template-rows: repeat(3, 140px);
            gap: 15px;
            margin: 2rem auto;
            perspective: 1000px;
        }

        .cell {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.15), rgba(33, 150, 243, 0.05));
            border: 3px solid rgba(33, 150, 243, 0.4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cell:hover:not(.taken) {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.25), rgba(33, 150, 243, 0.1));
            border-color: rgba(33, 150, 243, 0.7);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(33, 150, 243, 0.4);
        }

        .cell:hover:not(.taken)::before {
            opacity: 1;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #2196f3;
            text-shadow: 0 0 30px rgba(33, 150, 243, 0.8);
            animation: placeX 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cell.o {
            color: #ff4fd8;
            text-shadow: 0 0 30px rgba(255, 79, 216, 0.8);
            animation: placeO 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes placeX {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes placeO {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .cell.winner {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.2));
            border-color: #4caf50;
            animation: winPulse 0.6s ease-in-out infinite;
        }

        @keyframes winPulse {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(76, 175, 80, 0.6);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 50px rgba(76, 175, 80, 0.9);
                transform: scale(1.05);
            }
        }

        .game-mode-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }

        .mode-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.2), rgba(33, 150, 243, 0.1));
            border: 2px solid rgba(33, 150, 243, 0.4);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .mode-btn:hover,
        .mode-btn.active {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.4), rgba(33, 150, 243, 0.2));
            border-color: rgba(33, 150, 243, 0.8);
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.5);
            transform: translateY(-2px);
        }

        .status-message {
            font-size: 1.8rem;
            margin: 2rem 0;
            min-height: 2.5rem;
            color: #2196f3;
            text-shadow: 0 0 20px rgba(33, 150, 243, 0.6);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stats-display {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2rem 0;
        }

        .stat-box {
            text-align: center;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, rgba(10, 12, 24, 0.6), rgba(10, 12, 24, 0.3));
            border-radius: 15px;
            border: 2px solid rgba(33, 150, 243, 0.3);
        }

        .stat-box .label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .stat-box .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2196f3;
            text-shadow: 0 0 20px rgba(33, 150, 243, 0.6);
        }

        .stat-box.player-x .value {
            color: #2196f3;
        }

        .stat-box.player-o .value {
            color: #ff4fd8;
        }

        .stat-box.draws .value {
            color: #ffc107;
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 10px;
            }

            .cell {
                font-size: 3rem;
            }

            .stats-display {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles-container"></div>
    
    <a href="../games.html" class="back-button">← Back to Games</a>

    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>

        <div class="game-mode-selector">
            <button class="mode-btn active" data-mode="ai">vs AI</button>
            <button class="mode-btn" data-mode="player">vs Player</button>
        </div>

        <div class="status-message" id="statusMessage">Your Turn (X)</div>

        <div class="game-play-area">
            <div class="game-board" id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <button class="game-btn" id="resetBtn">New Game</button>

        <div class="stats-display">
            <div class="stat-box player-x">
                <div class="label">X Wins</div>
                <div class="value" id="xWins">0</div>
            </div>
            <div class="stat-box draws">
                <div class="label">Draws</div>
                <div class="value" id="draws">0</div>
            </div>
            <div class="stat-box player-o">
                <div class="label">O Wins</div>
                <div class="value" id="oWins">0</div>
            </div>
        </div>

        <div class="controls-info">
            <p>🎯 Get three in a row to win!</p>
            <p>🤖 AI mode: You are X, AI is O</p>
            <p>👥 Player mode: Take turns with a friend</p>
        </div>
    </div>

    <script src="../js/particles.js"></script>
    <script src="../js/tictactoe-game.js"></script>
</body>
</html>
